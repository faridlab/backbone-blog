      summary: Bulk update Tags (full, atomic)
      operationId: bulkUpdateTags
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                allOf:
                  - type: object
                    required: [id]
                    properties:
                      id:
                        type: string
