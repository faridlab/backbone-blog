# =============================================================================
# blog — the tag vocabulary: TagCategory + Tag.
#
# PORT DECISION (source: docs/odoo/website/blog — the Odoo global
# unique(name) is the addon's only 2 SQL constraints):
#  - Tag uniqueness grain is THE COMPANY, not the world. A global unique
#    is both a cross-tenant existence oracle (a 409 reveals someone
#    else's company has the tag) and a collision blocker (two tenants
#    cannot both have "News"). The hardening migration walls
#    UNIQUE (company_id, lower(name)) and UNIQUE (company_id, slug).
#    Within one company the vocabulary is shared across that company's
#    blogs and websites (the Odoo shared-vocabulary semantics, corrected
#    only at the tenancy seam). Per-website disjoint vocabularies are a
#    recorded reopening (an additive migration + an owner decision), not
#    a default.
#  - Tags attach to posts through the EXPLICIT PostTag join model (the
#    fence rides the join row).
#  - No color machinery (the Odoo random-color compute is not in the blog
#    cohort).
# =============================================================================

models:

  - name: TagCategory
    collection: tag_categories
    description: "Tag Category — the grouping row for blog tags. Company-owned master data."
    fields:
      id:
        type: uuid
        attributes: ["@id", "@default(uuid)"]
        description: "Unique record id"
      company_id:
        type: uuid
        attributes: ["@required", "@indexed", "@exclude_from_foreign_key_check"]
        description: "The strict fence column — logical ref to organization.companies(id), never a cross-schema FK."
      name:
        type: string
        attributes: ["@required", "@max(120)"]
        description: "Category label."
      metadata:
        type: Metadata
        attributes: ["@audit_metadata"]
        description: "Audit metadata"

  - name: Tag
    collection: tags
    description: "Tag — a company-grain vocabulary label optionally grouped under a category. Renames derive a new slug and record the redirect through the website surface."
    fields:
      id:
        type: uuid
        attributes: ["@id", "@default(uuid)"]
        description: "Unique record id"
      company_id:
        type: uuid
        attributes: ["@required", "@indexed", "@exclude_from_foreign_key_check"]
        description: "The strict fence column — logical ref to organization.companies(id), never a cross-schema FK."
      name:
        type: string
        attributes: ["@required", "@max(120)"]
        description: "Tag label. Unique per company case-folded (the hardening wall)."
      slug:
        type: string
        attributes: ["@required", "@max(120)"]
        description: "Kebab slug, service-derived from the name, unique per company (the hardening wall)."
      category_id:
        type: uuid?
        attributes: ["@foreign_key(TagCategory.tag_categories)", "@indexed"]
        description: "Optional grouping category (real intra-schema FK, RESTRICT)."
      metadata:
        type: Metadata
        attributes: ["@audit_metadata"]
        description: "Audit metadata"

    relations:
      category:
        type: TagCategory?
        attributes: ["@one", "@foreign_key(category_id)", "@restrict"]
        description: "The optional grouping category"

    indexes:
      - type: index
        fields: [category_id]
        description: "The per-category tag read"
